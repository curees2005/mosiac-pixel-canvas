[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/canvas-state"
  to = "/.netlify/functions/canvas-state"
  status = 200

[[redirects]]
  from = "/api/place-pixel"
  to = "/.netlify/functions/place-pixel"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"
  functions = "netlify/functions"
  autoLaunch = false
